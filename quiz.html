<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE QUIZZZZ</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!--Leaflet ❤️❤️❤️-->
 <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
<!-- Make sure you put this AFTER Leaflet's CSS ❤️-->
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

    <link rel="stylesheet" href="quiz.css" />
    <!-- Leaflet CSS/JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>

    <div class="video-card">
      <video autoplay loop muted playsinline class="card-video">
        <source src="date.mp4" type="video/mp4" />
      </video>
      <div class="card-overlay"></div>
    </div>

    <div id="welcome-msg">Welcome to our first date quiz my PLLUM 🕊️❤️</div>

    <div id="quiz-container">
      <div id="quiz-options" class="hidden">
        <!--question-->
        <h2 id="question-title" class="question-title"></h2>
        
        <!-- Hidden Map (Only shows for map question) -->
        <div id="map" class="hidden"  ></div>

        <!-- Buttons generate here dynamically -->
        <div id="buttons-container"></div>
        
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
